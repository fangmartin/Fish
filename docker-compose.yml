services:
  fish:
    image: ${FISH_IMAGE:-registry.cn-hangzhou.aliyuncs.com/martin-aigc/fish:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: draw-and-raise-fish
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DATA_DIR: "/app/data"
      TZ: "Asia/Shanghai"
      ADMIN_SECRET: "${ADMIN_SECRET:-}"
      REGISTER_IP_DAILY_LIMIT: "${REGISTER_IP_DAILY_LIMIT:-8}"
      DROP_IP_MINUTE_LIMIT: "${DROP_IP_MINUTE_LIMIT:-30}"
    volumes:
      - ./data:/app/data

  caddy:
    image: caddy:2-alpine
    container_name: draw-and-raise-fish-caddy
    restart: unless-stopped
    depends_on:
      - fish
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
